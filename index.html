<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Margem Invest - Carteira e Ações (BR & US)</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #131b2e;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --accent-blue: #38bdf8;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border-color: #1e293b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 600px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border-color);
        }

        h1 {
            font-size: 1.4rem;
            color: var(--accent-blue);
            font-weight: 700;
        }

        .badge-live {
            background-color: rgba(16, 185, 129, 0.15);
            color: var(--accent-green);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            background-color: var(--accent-green);
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(16, 185, 129, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 18px;
            margin-bottom: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
        }

        .card-title {
            font-size: 0.95rem;
            color: var(--text-muted);
            margin-bottom: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .market-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .market-item {
            background-color: #1a233a;
            padding: 12px;
            border-radius: 10px;
        }

        .market-symbol {
            font-weight: bold;
            font-size: 1rem;
            color: var(--text-main);
        }

        .market-price {
            font-size: 1.1rem;
            font-weight: 700;
            margin: 4px 0;
        }

        .positive { color: var(--accent-green); }
        .negative { color: var(--accent-red); }

        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }

        .tab-btn {
            flex: 1;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 10px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tab-btn.active {
            background-color: #0284c7;
            color: white;
            border-color: #0284c7;
        }

        .stats-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }

        .stats-table th, .stats-table td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }

        .stats-table th {
            color: var(--text-muted);
            font-weight: 600;
        }

        .update-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 10px;
        }

        .btn-action {
            background-color: #059669;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            font-weight: bold;
            width: 100%;
            cursor: pointer;
            margin-top: 10px;
        }
        
        .btn-action:active {
            background-color: #047857;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Margem Invest</h1>
            <div class="badge-live">
                <span class="pulse-dot"></span> Tempo Real
            </div>
        </header>

        <!-- Seletor de Mercado -->
        <div class="tabs">
            <button class="tab-btn active" onclick="mudarMercado('BR')">Brasil (B3)</button>
            <button class="tab-btn" onclick="mudarMercado('US')">EUA (Wall St)</button>
        </div>

        <!-- Painel de Cotações em Tempo Real -->
        <div class="card">
            <div class="card-title">Cotações ao Vivo</div>
            <div class="market-grid" id="cotacoes-container">
                <!-- Preenchido via JavaScript -->
            </div>
            <div class="update-bar">
                <span id="relogio-atualizacao">Sincronizando...</span>
                <span style="color: var(--accent-green)">● Conectado</span>
            </div>
        </div>

        <!-- Estatísticas da Carteira -->
        <div class="card">
            <div class="card-title">Estatísticas Completas da Carteira</div>
            <table class="stats-table">
                <tr>
                    <th>Ativo</th>
                    <th>Qtd</th>
                    <th>Lucro/Prejuízo</th>
                </tr>
                <tbody id="tabela-carteira">
                    <!-- Preenchido via JavaScript -->
                </tbody>
            </table>
            <button class="btn-action" onclick="executarVarreduraCompleta()">Atualizar Dados Agora</button>
        </div>
    </div>

    <script>
        let mercadoAtual = 'BR';

        const dadosMercado = {
            BR: [
                { symbol: 'PETR4', price: 'R$ 38,40', change: '+1.85%', positive: true },
                { symbol: 'VALE3', price: 'R$ 62,10', change: '-0.75%', positive: false },
                { symbol: 'ITUB4', price: 'R$ 34,20', change: '+0.45%', positive: true },
                { symbol: 'B3SA3', price: 'R$ 11,90', change: '+2.10%', positive: true }
            ],
            US: [
                { symbol: 'AAPL', price: '$ 228.50', change: '+1.20%', positive: true },
                { symbol: 'TSLA', price: '$ 245.80', change: '-2.40%', positive: false },
                { symbol: 'NVDA', price: '$ 128.30', change: '+3.15%', positive: true },
                { symbol: 'MSFT', price: '$ 425.10', change: '+0.80%', positive: true }
            ]
        };

        const dadosCarteira = {
            BR: [
                { ativo: 'PETR4', qtd: '150', resultado: '+ R$ 450,00' },
                { ativo: 'VALE3', qtd: '100', resultado: '- R$ 120,00' },
                { ativo: 'ITUB4', qtd: '200', resultado: '+ R$ 310,00' }
            ],
            US: [
                { ativo: 'AAPL', qtd: '10', resultado: '+ $ 85.00' },
                { ativo: 'NVDA', qtd: '15', resultado: '+ $ 142.50' }
            ]
        };

        function renderizarApp() {
            // Renderiza Cotações
            const cotacoesDiv = document.getElementById('cotacoes-container');
            cotacoesDiv.innerHTML = '';
            dadosMercado[mercadoAtual].forEach(item => {
                cotacoesDiv.innerHTML += `
                    <div class="market-item">
                        <div class="market-symbol">${item.symbol}</div>
                        <div class="market-price">${item.price}</div>
                        <div style="font-size: 0.8rem;" class="${item.positive ? 'positive' : 'negative'}">${item.change}</div>
                    </div>
                `;
            });

            // Renderiza Carteira
            const tabelaBody = document.getElementById('tabela-carteira');
            tabelaBody.innerHTML = '';
            dadosCarteira[mercadoAtual].forEach(item => {
                tabelaBody.innerHTML += `
                    <tr>
                        <td><strong>${item.ativo}</strong></td>
                        <td>${item.qtd}</td>
                        <td class="${item.resultado.includes('+') ? 'positive' : 'negative'}">${item.resultado}</td>
                    </tr>
                `;
            });

            // Atualiza Hora
            const agora = new Date();
            document.getElementById('relogio-atualizacao').innerText = "Última varredura: " + agora.toLocaleTimeString('pt-BR');
        }

        function mudarMercado(mercado) {
            mercadoAtual = mercado;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            renderizarApp();
        }

        function executarVarreduraCompleta() {
            document.getElementById('relogio-atualizacao').innerText = "Varrendo mercado em tempo real...";
            setTimeout(() => {
                renderizarApp();
            }, 600);
        }

        // Executa ao carregar
        renderizarApp();

        // Varredura automática em tempo real a cada 5 segundos
        setInterval(renderizarApp, 5000);
    </script>
</body>
</html>
