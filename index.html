doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0369a1">
<title>Margem Invest - Painel Profissional</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap" rel="stylesheet">
<style>
:root{
--bg:#070a13; --surface:#111827; --surface-2:#1f2937; --ink:#f9fafb; --ink-2:#9ca3af; --line:#1e293b;
--accent:#38bdf8; --accent-ink:#0369a1;
--fill-br:#0284c7; --fill-us:#d97706; --fill-re:#7c3aed; --fill-fx:#475569;
--good:#22c55e; --warn:#f59e0b; --bad:#ef4444;
--font-display:'Newsreader',Georgia,serif;
--font-body:'IBM Plex Sans',system-ui,sans-serif;
--font-mono:'IBM Plex Mono',monospace;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--font-body);margin:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding:18px 16px 120px}
​.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand svg{flex:none;color:var(--accent)}
.brand h1{font:700 24px/1 var(--font-body);letter-spacing:-.02em;margin:0;color:var(--accent)}
.brand p{margin:3px 0 0;font-size:12px;color:var(--ink-2)}
.top-r{display:flex;align-items:center;gap:8px}
.chip{font:600 11px/1 var(--font-mono);letter-spacing:.04em;text-transform:uppercase;border:1px solid rgba(34,197,94,0.3);background:rgba(34,197,94,0.1);border-radius:99px;padding:6px 12px;color:var(--good);display:flex;align-items:center;gap:6px}
.chip::before{content:"";width:6px;height:6px;background:var(--good);border-radius:50%;animation:pulse 1.5s infinite}
@keyframes pulse{0%{transform:scale(0.95);box-shadow:0 0 0 0 rgba(34,197,94,0.7)}70%{transform:scale(1);box-shadow:0 0 0 6px rgba(34,197,94,0)}100%{transform:scale(0.95);box-shadow:0 0 0 0 rgba(34,197,94,0)}}
​.gear{width:40px;height:40px;border:1px solid var(--line);background:var(--surface);border-radius:10px;display:grid;place-items:center;color:var(--ink);transition:all 0.2s}
.gear:hover{border-color:var(--accent)}
.intro{color:var(--ink-2);font-size:14px;margin:10px 0 20px;max-width:56ch}
​h2{font:600 18px/1.2 var(--font-body);letter-spacing:-.01em;margin:0;color:var(--ink)}
.sec{margin-top:28px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px}
.lbl{font:600 11px/1.3 var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.note{font-size:12.5px;color:var(--ink-2);margin:8px 0 0}
​.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:0 4px 20px rgba(0,0,0,0.3)}
.field{display:grid;gap:8px}
.field+.field{margin-top:16px}
.field-row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.field-row output{font:600 13px var(--font-mono);color:var(--accent);text-align:right}
.money{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:0 14px;min-height:50px}
.money span{color:var(--ink-2);font-family:var(--font-mono);margin-right:8px}
.money input{flex:1;min-width:0;border:0;background:transparent;font:700 20px var(--font-mono);outline:none;padding:8px 0;color:var(--ink)}
.money:focus-within{border-color:var(--accent);box-shadow:0 0 0 2px rgba(56,189,248,0.2)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.seg button{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 6px;min-height:52px;text-align:center;line-height:1.2;transition:all 0.2s}
.seg button b{display:block;font-weight:600;font-size:13px;color:var(--ink)}
.seg button small{display:block;font-size:11px;color:var(--ink-2);margin-top:3px}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.seg button[aria-pressed="true"] b,.seg button[aria-pressed="true"] small{color:var(--accent-ink)}
input[type=range]{width:100%;accent-color:var(--accent);height:28px}
.range-ends{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink-2)}
.summary{margin-top:18px;padding-top:14px;border-top:1px solid var(--line);font-size:13px;color:var(--ink-2)}
.summary b{color:var(--ink)}
​.macro{display:grid;grid-template-columns:repeat(5,1fr);border:1px solid var(--line);border-radius:12px;background:var(--surface);margin-bottom:18px;overflow:hidden}
.macro div{padding:12px;border-left:1px solid var(--line);min-width:0}
.macro div:first-child{border-left:0}
.macro b{display:block;font:600 15px/1.2 var(--font-mono);margin-top:4px;color:var(--ink);white-space:nowrap}
@media (max-width:560px){
.macro{grid-template-columns:repeat(3,1fr)}
.macro div:nth-child(4){border-left:0}
.macro div:nth-child(n+4){border-top:1px solid var(--line)}
.macro div:nth-child(5){grid-column:span 2}
}
​.headline{display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin:14px 0;border-block:1px solid var(--line)}
.headline div{padding:12px 0 12px 12px;border-left:1px solid var(--line);min-width:0}
.headline div:first-child{padding-left:0;border-left:0}
.big{font:700 24px/1.1 var(--font-mono);letter-spacing:-.02em;display:block;margin-top:4px;color:var(--ink)}
.big small{font:500 11px var(--font-mono);color:var(--ink-2);margin-left:3px}
​.tm{position:relative;width:100%;aspect-ratio:160/110;border-radius:8px;overflow:hidden;background:var(--bg)}
.cell{position:absolute;padding:2px;border:0;background:transparent;text-align:left}
.cell>span{display:flex;flex-direction:column;justify-content:space-between;gap:2px;height:100%;border-radius:6px;padding:8px;color:#fff;overflow:hidden;line-height:1.15;box-shadow:inset 0 1px 0 rgba(255,255,255,0.2)}
.cell .tk{font:700 13px var(--font-mono)}
.cell .wt{font:500 11px var(--font-mono);opacity:.9}
.cell.br>span{background:var(--fill-br)}
.cell.us>span{background:var(--fill-us)}
.cell.re>span{background:var(--fill-re)}
.cell.fx>span{background:var(--fill-fx)}
.cell:hover>span{filter:brightness(1.15)}
​.legend{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:12px;font-size:12.5px;color:var(--ink-2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
​.pos{display:grid;grid-template-columns:8px minmax(0,1fr) auto auto;gap:12px;align-items:center;width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid var(--line);padding:14px 0}
.pos .dot{width:8px;height:32px;border-radius:4px}
.dot.br{background:var(--fill-br)}.dot.us{background:var(--fill-us)}.dot.re{background:var(--fill-re)}.dot.fx{background:var(--fill-fx)}
.tkr{font:700 14px var(--font-mono);color:var(--ink)}
.sub{font-size:12.5px;color:var(--ink-2)}
.main{min-width:0}
.amt{text-align:right}
.amt b{display:block;font:600 14px var(--font-mono);color:var(--ink)}
.amt small{font-size:11.5px;color:var(--ink-2);display:block}
.pill{font:600 11px/1 var(--font-mono);padding:5px 8px;border-radius:6px}
.p-good{color:var(--good);background:rgba(34,197,94,0.15)}
.p-info{color:var(--accent);background:rgba(56,189,248,0.15)}
.p-warn{color:var(--warn);background:rgba(245,158,11,0.15)}
.p-bad{color:var(--bad);background:rgba(239,68,68,0.15)}
.pos-good{color:var(--good)}.pos-bad{color:var(--bad)}
​.act{display:flex;gap:10px;margin-top:16px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;min-height:48px;padding:0 20px;font-weight:600;color:var(--ink);transition:all 0.2s}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.05)}
textarea.copybox{width:100%;margin-top:12px;min-height:140px;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:12px;font:12.5px/1.5 var(--font-mono);color:var(--ink)}
​.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:8px 14px;font-size:13px;color:var(--ink-2);transition:all 0.2s}
.chips button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.sel{margin-left:auto;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;font-size:13px;color:var(--ink)}
​.rank-head,.rk{display:grid;grid-template-columns:24px minmax(0,1fr) 60px 50px 44px;gap:8px;align-items:center}
.rank-head{padding:8px 0;border-bottom:1px solid var(--line);color:var(--ink-2)}
.rank-head span:nth-child(n+3){text-align:right}
.rk{width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid var(--line);padding:12px 0}
.rk .n{font:500 12px var(--font-mono);color:var(--ink-2)}
.rk .num{font:600 13px var(--font-mono);text-align:right}
.more{display:block;width:100%;margin-top:14px;border:1px solid var(--line);background:var(--surface);border-radius:10px;min-height:48px;font-weight:600}
​.kpis{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden;margin-bottom:20px}
.kpi{padding:16px;border-bottom:1px solid var(--line);border-left:1px solid var(--line)}
.kpi:nth-child(odd){border-left:0}
.kpi .big{font-size:24px;color:var(--accent)}
.kpi p{margin:4px 0 0;font-size:12px;color:var(--ink-2)}
​.bars{display:grid;gap:12px}
.bar-row{display:grid;grid-template-columns:minmax(90px,34%) 1fr 52px;gap:12px;align-items:center;font-size:13px}
.bar-row .nm{color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track{position:relative;height:10px;background:var(--bg);border-radius:5px;overflow:hidden}
.track i{position:absolute;inset:0 auto 0 0;border-radius:5px;background:var(--accent)}
.bar-row .v{font:600 12.5px var(--font-mono);text-align:right}
​.split{display:flex;height:36px;border-radius:8px;overflow:hidden;gap:2px;background:var(--bg);padding:2px}
.split div{display:flex;align-items:center;justify-content:center;color:#fff;font:600 11.5px var(--font-mono);min-width:0;white-space:nowrap;overflow:hidden;border-radius:6px}
​.chart{width:100%;max-width:600px;display:block;height:auto}
.chart text{font-family:var(--font-mono);fill:var(--ink-2)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .axis{stroke:var(--ink-2);stroke-width:1}
​.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:right}
th:first-child,td:first-child{text-align:left}
th{font:600 11px var(--font-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
​.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(17,24,39,0.9);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:8px 16px calc(8px + env(safe-area-inset-bottom,0px))}
.tabs div{max-width:720px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tabs a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:50px;border-radius:10px;text-decoration:none;color:var(--ink-2);font-size:12px;font-weight:600;transition:all 0.2s}
.tabs a[aria-current="page"]{color:var(--accent-ink);background:var(--accent)}
​#sheet{position:fixed;inset:0;z-index:50}
#sheet .back{position:absolute;inset:0;background:rgba(3,7,18,0.7);backdrop-filter:blur(4px)}
#sheet .panel{position:absolute;left:0;right:0;bottom:0;max-width:720px;margin:0 auto;max-height:90dvh;overflow:auto;background:var(--surface);border-radius:20px 20px 0 0;border:1px solid var(--line);border-bottom:0;padding:20px 16px calc(30px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 40px rgba(0,0,0,0.5)}
.sh-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.sh-head h3{font:700 22px/1.2 var(--font-body);margin:0;color:var(--ink)}
.sh-btns{display:flex;gap:8px}
.x{border:1px solid var(--line);background:var(--bg);border-radius:10px;width:40px;height:40px;display:grid;place-items:center;font-size:18px;color:var(--ink)}
​#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;font-size:13px;font-weight:600;box-shadow:0 5px 20px rgba(0,0,0,0.4)}
</style>
</head>
<body>
​<div class="wrap">
<header class="top">
<div class="brand">
<svg width="32" height="32" viewBox="0 0 30 30" fill="none"><rect x="3" y="4" width="24" height="7" rx="1.5" fill="currentColor"/><rect x="3" y="19" width="15" height="7" rx="1.5" stroke="currentColor" stroke-width="2"/><path d="M21 22.5h6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
<div><h1>Margem Invest</h1><p data-i18n="app.sub"></p></div>
</div>
<div class="top-r">
<span class="chip" data-i18n="chip.ref">Online</span>
<button type="button" class="gear" id="gear" aria-label="Settings"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg></button>
</div>
</header>
​<main>
<div id="view-carteira">
<p class="intro" data-i18n="intro"></p>
​<section aria-labelledby="h-macro">
<div class="macro" id="macro"></div>
</section>
​<section class="card" aria-label="Perfil">
<div class="field">
<label class="lbl" for="amount" data-i18n="amount.l"></label>
<div class="money"><span>R$</span><input id="amount" type="number" inputmode="numeric" min="0" step="500" value="10000"></div>
</div>
<div class="field">
<span class="lbl" id="l-hz" data-i18n="hz.l"></span>
<div class="seg" role="group" aria-labelledby="l-hz" id="seg-hz">
<button type="button" data-hz="curto"><b data-i18n="hz.curto"></b><small data-i18n="hz.curto.s"></small></button>
<button type="button" data-hz="medio"><b data-i18n="hz.medio"></b><small data-i18n="hz.medio.s"></small></button>
<button type="button" data-hz="longo"><b data-i18n="hz.longo"></b><small data-i18n="hz.longo.s"></small></button>
</div>
</div>
<div class="field">
<span class="lbl" id="l-pf" data-i18n="pf.l"></span>
<div class="seg" role="group" aria-labelledby="l-pf" id="seg-pf">
<button type="button" data-pf="cons"><b data-i18n="pf.cons"></b><small data-i18n="pf.cons.s"></small></button>
<button type="button" data-pf="mod"><b data-i18n="pf.mod"></b><small data-i18n="pf.mod.s"></small></button>
<button type="button" data-pf="arr"><b data-i18n="pf.arr"></b><small data-i18n="pf.arr.s"></small></button>
</div>
</div>
<div class="field">
<div class="field-row"><label class="lbl" for="ext" data-i18n="ext.l"></label><output id="ext-out" for="ext"></output></div>
<input id="ext" type="range" min="0" max="100" step="5" value="30">
<div class="range-ends"><span data-i18n="ext.br"></span><span data-i18n="ext.us"></span></div>
</div>
<div class="field">
<div class="field-row"><label class="lbl" for="fii" data-i18n="fii.l"></label><output id="fii-out" for="fii"></output></div>
<input id="fii" type="range" min="0" max="40" step="5" value="15">
<div class="range-ends"><span data-i18n="fii.min"></span><span>40%</span></div>
</div>
<div class="summary" id="summary"></div>
</section>
​<section class="sec" aria-labelledby="h-cart">
<div class="sec-head"><h2 id="h-cart" data-i18n="cart.h"></h2><span class="lbl" id="cart-n"></span></div>
<div class="card">
<div class="headline" id="headline"></div>
<div class="tm" id="tm" role="group" aria-label="Mapa"></div>
<div class="legend" id="legend"></div>
<div class="list" id="positions"></div>
</div>
<div class="act"><button type="button" class="btn pri" id="copy" data-i18n="copy.btn"></button></div>
<textarea class="copybox" id="copybox" readonly hidden aria-label="Carteira"></textarea>
</section>
​<section class="sec" aria-labelledby="h-rank">
<div class="sec-head"><h2 id="h-rank" data-i18n="rank.h"></h2></div>
<div class="filters">
<div class="chips" id="chips">
<button type="button" data-mkt="all" data-i18n="f.all"></button>
<button type="button" data-mkt="BR" data-i18n="f.br"></button>
<button type="button" data-mkt="US" data-i18n="f.us"></button>
<button type="button" data-mkt="FI" data-i18n="f.fi"></button>
<button type="button" data-mkt="fav" data-i18n="f.fav" aria-label="Favoritos"></button>
</div>
<select class="sel" id="sort" aria-label="Sort">
<option value="score" data-i18n="sort.score"></option>
<option value="mos" data-i18n="sort.mos"></option>
<option value="dy" data-i18n="sort.dy"></option>
<option value="g" data-i18n="sort.g"></option>
<option value="risk" data-i18n="sort.risk"></option>
</select>
</div>
<div class="card">
<div class="rank-head lbl"><span>#</span><span data-i18n="col.asset"></span><span data-i18n="col.mos"></span><span>DY</span><span data-i18n="col.score"></span></div>
<div id="rank"></div>
</div>
<button type="button" class="more" id="more"></button>
</section>
</div>
​<div id="view-estatisticas" hidden>
<div class="sec-head" style="margin-top:6px"><h2 data-i18n="st.h"></h2><span class="lbl" id="st-sub"></span></div>
<div class="kpis" id="kpis"></div>
​<section class="sec" aria-labelledby="h-aloc">
<div class="card">
<div class="sec-head"><h2 id="h-aloc" data-i18n="st.aloc"></h2></div>
<div class="split" id="split"></div>
<p class="lbl" style="margin:18px 0 10px" data-i18n="st.sector"></p>
<div class="bars" id="sectors"></div>
</div>
</section>
​<section class="sec" aria-labelledby="h-map">
<div class="card">
<div class="sec-head"><h2 id="h-map" data-i18n="st.map"></h2></div>
<svg class="chart" id="scatter" viewBox="0 0 360 300" role="img"></svg>
<div class="legend" id="scatter-leg"></div>
</div>
</section>
​<section class="sec" aria-labelledby="h-sim">
<div class="card">
<div class="sec-head"><h2 id="h-sim" data-i18n="st.sim"></h2><span class="lbl" id="sim-sub"></span></div>
<div class="field" style="margin-bottom:14px">
<label class="lbl" for="pmt" data-i18n="sim.pmt.l"></label>
<div class="money"><span>R$</span><input id="pmt" type="number" step="100" min="0" inputmode="numeric"></div>
</div>
<div class="sw" id="sim-leg" style="margin-bottom:10px;display:flex;gap:12px;font-size:12px"></div>
<svg class="chart" id="sim" viewBox="0 0 360 240" role="img"></svg>
<div class="tbl-wrap" style="margin-top:14px"><table id="sim-tbl"></table></div>
</div>
</section>
</div>
</main>
</div>
​<nav class="tabs" aria-label="Tabs">
<div>
<a href="#carteira" id="tab-carteira"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="10" height="11" rx="1.5"/><rect x="15" y="3" width="6" height="7" rx="1.5"/><rect x="15" y="12" width="6" height="9" rx="1.5"/><rect x="3" y="16" width="10" height="5" rx="1.5"/></svg><span data-i18n="tab.cart"></span></a>
<a href="#estatisticas" id="tab-estatisticas"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span data-i18n="tab.stat"></span></a>
</div>
</nav>

const nav=clamp(1/(s.pvp||1)-1,-.3,.3);

return {gr:nav,ly:nav,mos:nav100,bz:null,f,score,er:(s.dy||0)+1};
}
const pl=s.pl||10,pvp=s.pvp||1;
const gr=(pl>0&&pvp>0)?clamp(Math.sqrt(22.5/(plpvp))-1,-.6,1):-.6;
const fair=clamp((s.g||0)+(s.dy||0),6,30);
const ly=pl>0?clamp(fair/pl-1,-.6,1):-.6;
const mos=(gr+ly)/2;
const bz=(s.dy||0)>0?(s.dy)/6-1:-1;
const q=[[clamp((s.roe||15)/30,0,1)100,.5]];
if(s.mg!=null)q.push([clamp(s.mg/30,0,1)100,.35]);
if(s.dv!=null)q.push([clamp(1-s.dv/4,0,1)100,.15]);
const st=[[clamp(1-((s.b||1)-.4)/1.4,0,1)100,.7]];
if(s.dv!=null)st.push([clamp(1-s.dv/4,0,1)100,.3]);
const f={v:(mos+.6)/1.6100,q:wavg(q),g:clamp(((s.g||5)+2)/22,0,1)100,r:clamp((s.dy||5)/10,0,1)100,s:wavg(st)};
const score=f.vw.v+f.qw.q+f.gw.g+f.rw.r+f.sw.s;
return {gr,ly,mos:mos100,bz:bz100,f,score,er:(s.dy||5)+.7*clamp(s.g||5,0,15)};

}

for(const x of p){if(out.length>=n)break;if((cnt[x.s]||0)>=2)continue;out.push(x);cnt[x.s]=(cnt[x.s]||0)+1}

const eq=100-P.fixed;
const fiSh=nFI?state.fii/100:0;
const base={BR:(1-fiSh)(1-state.ext/100),US:(1-fiSh)*state.ext/100,FI:fiSh};
const present=['BR','US','FI'].filter(c=>items.some(x=>x.c=c));
const tot=present.reduce((a,c)=>a+base[c],0)||1;
const share={};present.forEach(c=>share[c]=base[c]/tot);
for(const c of present){
const g=items.filter(x=>x.c===c);
const raw=g.map(x=>(x.scorex.score)/Math.sqrt(x.b||1));
const rt=raw.reduce((a,b)=>a+b,0)||1;
g.forEach((x,i)=>x.w=eqshare[c]*raw[i]/rt);
}
const sum=items.reduce((a,x)=>a+x.w,0);
items.sort((a,b)=>b.w-a.w);
return {items,fixed:Math.max(0,100-sum),N:items.length};
}catch(e){
return {items:sc.slice(0,5).map(x=>({...x,w:16})),fixed:20,N:5};
}
}

const worst=(row,side)=>{const s=row.reduce((a,r)=>a+r.area,0)||1,mx=Math.max(...row.map(r=>r.area)),mn=Math.min(...row.map(r=>r.area));return Math.max(sidesidemx/(ss),ss/(sidesidemn))};
while(rest.length){
const side=Math.min(w,h);let row=[rest[0]],i=1;
while(i<rest.length){const nr=row.concat(rest[i]);if(worst(nr,side)<=worst(row,side)){row=nr;i++}else break}
const s=row.reduce((a,r)=>a+r.area,0);
if(w>=h){const cw=s/(h||1);let cy=y;row.forEach(r=>{const ch=r.area/(cw||1);out.push({...r,x,y:cy,w:cw,h:ch});cy+=ch});x+=cw;w-=cw}
else{const rh=s/(w||1);let cx=x;row.forEach(r=>{const cw=r.area/(rh||1);out.push({...r,x:cx,y,w:cw,h:rh});cx+=cw});y+=rh;h-=rh}
rest=rest.slice(row.length);
}
return out;
}catch(e){return []}
}
​function qty(x,valBrl){
try{
const pr=x.price;if(!pr||pr<=0)return null;
const local=x.c==='US'?valBrl/MACRO.usd:valBrl;
return Math.floor(local/pr);
}catch(e){return null}
}

​function fv(amt,pmt,r,yrs){
try{
const g=Math.pow(1+Math.max(r,-50)/100,yrs),rm=Math.pow(1+Math.max(r,-50)/100,1/12)-1;
return amtg+(rm>1e-9?pmt(Math.pow(1+rm,12yrs)-1)/rm:pmt12*yrs);
}catch(e){return amt}
}
