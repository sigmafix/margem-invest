<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Margem Invest - Painel em Tempo Real</title>
    <style>
        :root {
            --bg-color: #090d16;
            --card-bg: #111827;
            --accent-color: #38bdf8;
            --success-color: #22c55e;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border-color: #1f2937;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
            width: 100%;
            max-width: 480px;
        }

        .header h1 {
            font-size: 1.75rem;
            color: var(--accent-color);
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .header p {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-top: 4px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 24px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            margin-bottom: 16px;
        }

        .status-box {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: rgba(31, 41, 55, 0.5);
            padding: 14px 18px;
            border-radius: 12px;
            margin-bottom: 20px;
            border: 1px solid rgba(56, 189, 248, 0.1);
        }

        .status-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .pulse {
            width: 12px;
            height: 12px;
            background-color: var(--success-color);
            border-radius: 50%;
            box-shadow: 0 0 0 rgba(34, 197, 94, 0.4);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% {
                transform: scale(0.95);
                box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7);
            }
            70% {
                transform: scale(1);
                box-shadow: 0 0 0 8px rgba(34, 197, 94, 0);
            }
            100% {
                transform: scale(0.95);
                box-shadow: 0 0 0 0 rgba(34, 197, 94, 0);
            }
        }

        .status-text {
            font-weight: 600;
            font-size: 0.95rem;
            color: var(--text-main);
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .metric-card {
            background-color: #1f2937;
            padding: 14px;
            border-radius: 10px;
            text-align: left;
        }

        .metric-title {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        .metric-value {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .footer-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
            color: var(--text-muted);
            border-top: 1px solid var(--border-color);
            padding-top: 14px;
        }

        .btn-refresh {
            background-color: #0369a1;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-refresh:active {
            background-color: #0284c7;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Margem Invest</h1>
        <p>Monitoramento e Análise em Tempo Real</p>
    </div>

    <div class="card">
        <div class="status-box">
            <div class="status-info">
                <span class="pulse"></span>
                <span class="status-text" id="status-label">Varredura Ativa</span>
            </div>
            <span style="font-size: 0.8rem; color: var(--success-color); font-weight: 600;">ONLINE</span>
        </div>

        <div class="metrics-grid">
            <div class="metric-card">
                <div class="metric-title">Status da Rede</div>
                <div class="metric-value" id="net-status">Estável</div>
            </div>
            <div class="metric-card">
                <div class="metric-title">Varreduras / min</div>
                <div class="metric-value">20 c/s</div>
            </div>
        </div>

        <div class="footer-info">
            <span id="relogio">Sincronizando...</span>
            <button class="btn-refresh" onclick="forcarVarredura()">Atualizar</button>
        </div>
    </div>

    <script>
        function atualizarSistema() {
            const agora = new Date();
            const horaFormatada = agora.toLocaleTimeString('pt-BR');
            document.getElementById('relogio').innerText = "Última varredura: " + horaFormatada;
        }

        function forcarVarredura() {
            const label = document.getElementById('status-label');
            label.innerText = "Varrendo agora...";
            setTimeout(() => {
                label.innerText = "Varredura Ativa";
                atualizarSistema();
            }, 800);
        }

        // Executa ao carregar
        atualizarSistema();

        // Varredura automática em tempo real a cada 3 segundos
        setInterval(atualizarSistema, 3000);
    </script>

</body>
</html>
