<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0A6B73"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Margem Invest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap" rel="stylesheet">
<style>
/* Layout: app de duas abas em coluna única, barra de abas fixa embaixo, mapa de blocos (treemap) como peça central da carteira. Cores de destaque e idioma são escolhidos pelo usuário (engrenagem). */
:root{
  --bg:#EDF1F4; --surface:#FFFFFF; --surface-2:#E3E9EE; --ink:#0D1B2A; --ink-2:#47596A; --line:#D0D9E0;
  --accent:#0A6B73; --accent-ink:#FFFFFF;
  --fill-br:#0A6B73; --fill-us:#9A5B13; --fill-re:#7A4B8F; --fill-fx:#4B5C6B;
  --good:#1E7F4F; --warn:#8F5A06; --bad:#B3372F;
  --font-display:'Newsreader',Georgia,'Times New Roman',serif;
  --font-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#08121A; --surface:#0F1C27; --surface-2:#182A38; --ink:#E7EEF3; --ink-2:#9BAEBE; --line:#233748;
    --accent:#3FB8C0; --accent-ink:#04262A;
    --fill-br:#14666E; --fill-us:#9A5B13; --fill-re:#7B4E93; --fill-fx:#3A4E5E;
    --good:#3FBF87; --warn:#E0A23B; --bad:#F0857C; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#08121A; --surface:#0F1C27; --surface-2:#182A38; --ink:#E7EEF3; --ink-2:#9BAEBE; --line:#233748;
  --accent:#3FB8C0; --accent-ink:#04262A;
  --fill-br:#14666E; --fill-us:#9A5B13; --fill-re:#7B4E93; --fill-fx:#3A4E5E;
  --good:#3FBF87; --warn:#E0A23B; --bad:#F0857C; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--font-body);font-variant-numeric:tabular-nums lining-nums;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding-block:18px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:6px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand svg{flex:none;color:var(--accent)}
.brand h1{font:500 28px/1 var(--font-display);letter-spacing:-.01em;margin:0}
.brand p{margin:3px 0 0;font-size:12px;color:var(--ink-2)}
.top-r{display:flex;align-items:center;gap:8px}
.chip{font:500 11px/1 var(--font-mono);letter-spacing:.04em;text-transform:uppercase;border:1px solid var(--line);border-radius:99px;padding:6px 10px;color:var(--ink-2);background:var(--surface);white-space:nowrap}
.gear{width:44px;height:44px;border:1px solid var(--line);background:var(--surface);border-radius:10px;display:grid;place-items:center;color:var(--ink)}
.intro{color:var(--ink-2);font-size:14px;margin:10px 0 18px;max-width:56ch}

h2{font:500 21px/1.2 var(--font-display);letter-spacing:-.005em;margin:0;text-wrap:balance}
.sec{margin-top:30px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px}
.lbl{font:500 11px/1.3 var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.note{font-size:12.5px;color:var(--ink-2);margin:8px 0 0}

.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}
.field{display:grid;gap:8px}
.field+.field{margin-top:18px}
.field-row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.field-row output{font:500 13px var(--font-mono);color:var(--ink);text-align:right}
.money{display:flex;align-items:center;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:0 12px;min-height:46px}
.money span{color:var(--ink-2);font-family:var(--font-mono);margin-right:8px}
.money input{flex:1;min-width:0;border:0;background:transparent;font:500 20px var(--font-mono);outline:none;padding:8px 0}
.money:focus-within{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 25%,transparent)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg button{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 6px;min-height:50px;text-align:center;line-height:1.2}
.seg button b{display:block;font-weight:600;font-size:14px}
.seg button small{display:block;font-size:11.5px;color:var(--ink-2);margin-top:2px}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.seg button[aria-pressed="true"] small{color:inherit;opacity:.85}
input[type=range]{width:100%;accent-color:var(--accent);height:28px}
.range-ends{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink-2)}
.summary{margin-top:16px;padding-top:14px;border-top:1px solid var(--line);font-size:13px;color:var(--ink-2)}
.summary b{color:var(--ink);font-weight:600}

.alert{display:grid;gap:4px;margin:0 0 16px;padding:12px 14px;border:1px solid color-mix(in srgb,var(--warn) 45%,transparent);background:color-mix(in srgb,var(--warn) 11%,transparent);border-radius:10px;font-size:13px;line-height:1.45}
.alert b{font-weight:600;color:var(--warn);display:flex;align-items:center;gap:8px}
.alert b::before{content:"!";display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--warn);color:var(--surface);font:600 12px var(--font-mono)}
.alert span{color:var(--ink)}
.alert.ok{border-color:color-mix(in srgb,var(--good) 45%,transparent);background:color-mix(in srgb,var(--good) 10%,transparent)}
.alert.ok b{color:var(--good)}
.alert.ok b::before{background:var(--good);content:"✓"}
.alert .btn{min-height:40px;font-size:13px;justify-self:start}
.status-l{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:7px 0;border-bottom:1px solid var(--line)}
.status-l b{font:500 12px var(--font-mono);text-align:right}
.tokf{display:grid;gap:4px;margin-top:10px;font-size:12px;color:var(--ink-2)}
.tokf input{border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:8px 10px;min-height:44px;font:500 14px var(--font-mono);width:100%}
.macro{display:grid;grid-template-columns:repeat(5,1fr);border:1px solid var(--line);border-radius:10px;background:var(--surface);margin-bottom:16px;overflow:hidden}
.macro div{padding:10px 10px 10px 12px;border-left:1px solid var(--line);min-width:0}
.macro div:first-child{border-left:0}
.macro b{display:block;font:500 17px/1.2 var(--font-mono);margin-top:3px;white-space:nowrap}
.macro .lbl{font-size:10px;letter-spacing:.05em}
@media (max-width:560px){
  .macro{grid-template-columns:repeat(3,1fr)}
  .macro div:nth-child(4){border-left:0}
  .macro div:nth-child(n+4){border-top:1px solid var(--line)}
  .macro div:nth-child(5){grid-column:span 2}
}

.headline{display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin:14px 0;border-block:1px solid var(--line)}
.headline div{padding:12px 0 12px 12px;border-left:1px solid var(--line);min-width:0}
.headline div:first-child{padding-left:0;border-left:0}
.big{font:500 28px/1.1 var(--font-display);letter-spacing:-.01em;display:block;margin-top:4px}
.big small{font:500 12px var(--font-mono);color:var(--ink-2);margin-left:3px}

.tm{position:relative;width:100%;aspect-ratio:160/110;border-radius:6px;overflow:hidden}
.cell{position:absolute;padding:1.5px;border:0;background:transparent;text-align:left}
.cell>span{display:flex;flex-direction:column;justify-content:space-between;gap:2px;height:100%;border-radius:3px;padding:6px 7px;color:#fff;overflow:hidden;line-height:1.15}
.cell .tk{font:600 13px var(--font-mono)}
.cell .wt{font:400 12px var(--font-mono);opacity:.92}
.cell.sm .tk{font-size:10.5px}
.cell.sm>span{padding:4px 5px}
.cell.br>span{background:var(--fill-br)}
.cell.us>span{background:var(--fill-us)}
.cell.re>span{background:var(--fill-re)}
.cell.fx>span{background:var(--fill-fx)}
.cell:hover>span,.cell:focus-visible>span{filter:brightness(1.12)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;font-size:12.5px;color:var(--ink-2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}

.list{margin-top:6px}
.pos{display:grid;grid-template-columns:8px minmax(0,1fr) auto auto;gap:12px;align-items:center;width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid var(--line);padding:12px 0;min-height:56px}
.pos .dot{width:8px;height:32px;border-radius:2px}
.dot.br{background:var(--fill-br)}.dot.us{background:var(--fill-us)}.dot.re{background:var(--fill-re)}.dot.fx{background:var(--fill-fx)}
.tkr{font:600 14px var(--font-mono)}
.sub{font-size:12.5px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.main{min-width:0}
.amt{text-align:right}
.amt b{display:block;font:500 14px var(--font-mono)}
.amt small{font-size:12px;color:var(--ink-2);display:block}
.pill{font:600 12px var(--font-mono);min-width:38px;text-align:center;padding:4px 6px;border-radius:5px}
.p-good{color:var(--good);background:color-mix(in srgb,var(--good) 15%,transparent)}
.p-info{color:var(--accent);background:color-mix(in srgb,var(--accent) 15%,transparent)}
.p-warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 17%,transparent)}
.p-bad{color:var(--bad);background:color-mix(in srgb,var(--bad) 15%,transparent)}
.pos-good{color:var(--good)}.pos-bad{color:var(--bad)}
.act{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;min-height:44px;padding:0 16px;font-weight:500}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
textarea.copybox{width:100%;margin-top:10px;min-height:150px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:10px;font:12.5px/1.5 var(--font-mono)}

.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 13px;min-height:38px;font-size:13px}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.sel{margin-left:auto;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px;min-height:38px;font-size:13px;max-width:100%}
.rank-head,.rk{display:grid;grid-template-columns:20px minmax(0,1fr) 52px 44px 40px;gap:8px;align-items:center}
.rank-head{padding:10px 0 6px;border-bottom:1px solid var(--ink)}
.rank-head span:nth-child(n+3){text-align:right}
.rk{width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid var(--line);padding:11px 0;min-height:54px}
.rk .n{font:400 12px var(--font-mono);color:var(--ink-2)}
.rk .num{font:500 13px var(--font-mono);text-align:right}
.rk .pill{justify-self:end}
.more{display:block;width:100%;margin-top:12px;border:1px solid var(--line);background:var(--surface);border-radius:8px;min-height:44px}
.empty{padding:22px 0;color:var(--ink-2);font-size:14px}

.kpis{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line)}
.kpi{padding:14px 0 14px 14px;border-bottom:1px solid var(--line);border-left:1px solid var(--line);min-width:0}
.kpi:nth-child(odd){padding-left:0;border-left:0}
.kpi .big{font-size:28px}
.kpi p{margin:4px 0 0;font-size:12px;color:var(--ink-2);line-height:1.35}
.bars{display:grid;gap:10px}
.bar-row{display:grid;grid-template-columns:minmax(84px,34%) 1fr 48px;gap:10px;align-items:center;font-size:13px}
.bar-row .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track{position:relative;height:10px;background:var(--surface-2);border-radius:2px}
.track i{position:absolute;inset:0 auto 0 0;border-radius:2px;background:var(--accent);transition:width .35s}
.track u{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);text-decoration:none}
.bar-row .v{font:500 12.5px var(--font-mono);text-align:right}
.split{display:flex;height:34px;border-radius:5px;overflow:hidden;gap:2px}
.split div{display:flex;align-items:center;padding:0 8px;color:#fff;font:500 12px var(--font-mono);min-width:0;white-space:nowrap;overflow:hidden}
.chart{width:100%;max-width:600px;display:block;height:auto}
.chart text{font-family:var(--font-mono);fill:var(--ink-2)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .axis{stroke:var(--ink-2);stroke-width:1}
.chart .pt{cursor:pointer}
.chart .tl{fill:var(--ink)}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:9px 8px 9px 0;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font:500 11px var(--font-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);border-bottom-color:var(--ink)}
td.mono{font-family:var(--font-mono)}
#sim-tbl th,#sim-tbl td{padding-right:6px;font-size:12px}
#sim-tbl th{font-size:10px;letter-spacing:.03em;white-space:normal;vertical-align:bottom}
#sim-tbl td:first-child{white-space:normal}
.two{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.mini{display:grid}
.mini button{display:flex;justify-content:space-between;gap:8px;width:100%;background:transparent;border:0;border-bottom:1px solid var(--line);padding:9px 0;text-align:left;min-height:42px}
.mini b{font:600 13px var(--font-mono)}
.mini span{font:500 13px var(--font-mono)}
.inputs{display:flex;flex-wrap:wrap;gap:10px 18px;margin:10px 0 4px}
.inputs label{display:flex;align-items:center;gap:8px;font-size:13px;flex-wrap:wrap}
.inputs input{width:96px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:8px 10px;font:500 14px var(--font-mono);min-height:40px}
.sw{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--ink-2);margin:6px 0 10px}
.sw i{display:inline-block;width:18px;height:3px;margin-right:6px;vertical-align:3px;border-radius:2px}
.ins{margin:0;padding:0;list-style:none;display:grid;gap:10px;font-size:14px}
.ins li{padding-left:16px;position:relative;max-width:62ch}
.ins li::before{content:"";position:absolute;left:0;top:.65em;width:7px;height:2px;background:var(--accent)}
.ins li.w::before{background:var(--warn)}
details{border-bottom:1px solid var(--line)}
summary{list-style:none;cursor:pointer;padding:13px 0;min-height:46px;display:flex;justify-content:space-between;gap:10px;font-weight:500}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font:400 18px var(--font-mono);color:var(--ink-2)}
details[open] summary::after{content:"−"}
details p{margin:0 0 14px;color:var(--ink-2);font-size:14px;max-width:60ch}
.legal{margin-top:34px;padding-top:14px;border-top:1px solid var(--line);font-size:12px;color:var(--ink-2);max-width:68ch}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.tabs div{max-width:720px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:6px}
.tabs a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:52px;border-radius:8px;text-decoration:none;color:var(--ink-2);font-size:12px;font-weight:500}
.tabs a[aria-current="page"]{color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent)}
.tabs svg{display:block}

#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:13px;max-width:calc(100% - 32px)}

#sheet{position:fixed;inset:0;z-index:50}
#sheet .back{position:absolute;inset:0;background:rgba(6,14,20,.55)}
#sheet .panel{position:absolute;left:0;right:0;bottom:0;max-width:720px;margin:0 auto;max-height:90dvh;overflow:auto;background:var(--surface);border-radius:14px 14px 0 0;border:1px solid var(--line);border-bottom:0;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));overscroll-behavior:contain}
.sh-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.sh-head h3{font:500 24px/1.15 var(--font-display);margin:0}
.sh-btns{display:flex;gap:8px;flex:none}
.x{border:1px solid var(--line);background:var(--bg);border-radius:8px;width:44px;height:44px;flex:none;font-size:20px;line-height:1}
.x[aria-pressed="true"]{color:var(--warn);border-color:var(--warn)}
.scorebox{display:flex;align-items:baseline;gap:12px;margin:14px 0 4px;flex-wrap:wrap}
.scorebox .big{font-size:48px;margin:0}
.scorebox span.tag{font:500 12px var(--font-mono);letter-spacing:.06em;text-transform:uppercase}
.mgrid{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);border-left:1px solid var(--line);margin-top:10px}
.mgrid div{padding:9px 8px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);min-width:0}
.mgrid .lbl{font-size:10px}
.mgrid b{display:block;font:500 15px var(--font-mono);margin-top:2px}
.bul{margin:6px 0 0;padding:0;list-style:none;display:grid;gap:6px;font-size:14px}
.bul li{padding-left:16px;position:relative}
.bul li::before{content:"";position:absolute;left:0;top:.6em;width:7px;height:2px;background:var(--good)}
.bul.att li::before{background:var(--warn)}
.edit{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;margin-top:10px}
.edit label{display:grid;gap:4px;font-size:12px;color:var(--ink-2)}
.edit input{border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:8px 10px;min-height:44px;font:500 14px var(--font-mono);width:100%}
.link{background:transparent;border:0;color:var(--accent);text-decoration:underline;padding:10px 0;min-height:44px}
.sh-sec{margin-top:20px}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.opts button{border:1px solid var(--line);background:var(--bg);border-radius:8px;min-height:46px;padding:0 16px;font-weight:500}
.opts button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.opts .sw-c{display:flex;align-items:center;gap:8px}
.opts .sw-c i{width:16px;height:16px;border-radius:50%;display:inline-block;border:2px solid var(--surface)}
@media (max-width:420px){
  .mgrid{grid-template-columns:repeat(2,1fr)}
  .rank-head,.rk{grid-template-columns:18px minmax(0,1fr) 48px 38px 38px;gap:6px}
  .two{grid-template-columns:1fr}
  .headline .big{font-size:23px}
  .chip{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <svg width="30" height="30" viewBox="0 0 30 30" fill="none" aria-hidden="true"><rect x="3" y="4" width="24" height="7" rx="1.5" fill="currentColor"/><rect x="3" y="19" width="15" height="7" rx="1.5" stroke="currentColor" stroke-width="2"/><path d="M21 22.5h6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <div><h1>Margem</h1><p data-i18n="app.sub"></p></div>

function weights(){
  const w={...HZ[state.hz].w};w.s*=PF[state.pf].mult;
  const tt=Object.values(w).reduce((a,b)=>a+b,0);
  for(const k in w)w[k]/=tt;
  return w;
}
function wavg(parts){const tt=parts.reduce((a,p)=>a+p[1],0);return parts.reduce((a,p)=>a+p[0]*p[1],0)/tt}
function scoreStock(s,w){
  if(s.c==='FI'){
    const nav=clamp(1/s.pvp-1,-.3,.3);
    const f={v:(nav+.3)/.6*100,q:s.vac==null?65:clamp(1-s.vac/20,0,1)*100,g:45,r:clamp(s.dy/14,0,1)*100,s:Math.min(clamp(1-(s.b-.1)/.8,0,1)*100,75)};
    const score=f.v*w.v+f.q*w.q+f.g*w.g+f.r*w.r+f.s*w.s;
    return {gr:nav,ly:nav,mos:nav*100,bz:null,f,score,er:s.dy+1};
  }
  const gr=(s.pl>0&&s.pvp>0)?clamp(Math.sqrt(22.5/(s.pl*s.pvp))-1,-.6,1):-.6;
  const fair=clamp((s.g||0)+(s.dy||0),6,30);
  const ly=s.pl>0?clamp(fair/s.pl-1,-.6,1):-.6;
  const mos=(gr+ly)/2;
  const bz=s.dy>0?s.dy/6-1:-1;
  const q=[[clamp(s.roe/30,0,1)*100,.5]];
  if(s.mg!=null)q.push([clamp(s.mg/30,0,1)*100,.35]);
  if(s.dv!=null)q.push([clamp(1-s.dv/4,0,1)*100,.15]);
  const st=[[clamp(1-(s.b-.4)/1.4,0,1)*100,.7]];
  if(s.dv!=null)st.push([clamp(1-s.dv/4,0,1)*100,.3]);
  const f={v:(mos+.6)/1.6*100,q:wavg(q),g:clamp((s.g+2)/22,0,1)*100,r:clamp(s.dy/10,0,1)*100,s:wavg(st)};
  const score=f.v*w.v+f.q*w.q+f.g*w.g+f.r*w.r+f.s*w.s;
  return {gr,ly,mos:mos*100,bz:bz*100,f,score,er:s.dy+.7*clamp(s.g,0,15)};
}

let SC=[],PORT=null;
function recompute(){const w=weights();SC=universe().map(s=>({...s,...scoreStock(s,w)}));PORT=build(SC)}

function build(sc){
  const P=PF[state.pf];
  const pool=c=>sc.filter(x=>x.c===c).sort((a,b)=>b.score-a.score);
  const pick=(c,n)=>{const p=pool(c),out=[],cnt={};
    for(const x of p){if(out.length>=n)break;if((cnt[x.s]||0)>=2)continue;out.push(x);cnt[x.s]=(cnt[x.s]||0)+1}
    for(const x of p){if(out.length>=n)break;if(!out.includes(x))out.push(x)}
    return out};
  let nFI=state.fii>0?clamp(Math.round(P.n*state.fii/100*2),1,4):0;nFI=Math.min(nFI,pool('FI').length);
  const rest=P.n-nFI;
  const nUS=Math.min(Math.round(rest*state.ext/100),pool('US').length);
  const nBR=state.ext>=100?0:Math.min(rest-nUS,pool('BR').length);
  const items=[...pick('BR',nBR),...pick('US',nUS),...pick('FI',nFI)].map(x=>({...x}));
  const eq=100-P.fixed;
  const fiSh=nFI?state.fii/100:0;
  const base={BR:(1-fiSh)*(1-state.ext/100),US:(1-fiSh)*state.ext/100,FI:fiSh};
  const present=['BR','US','FI'].filter(c=>items.some(x=>x.c===c));
  const tot=present.reduce((a,c)=>a+base[c],0)||1;
  const share={};present.forEach(c=>share[c]=base[c]/tot);
  for(const c of present){
    const g=items.filter(x=>x.c===c);
    const raw=g.map(x=>x.score*x.score/Math.sqrt(x.b));
    const rt=raw.reduce((a,b)=>a+b,0);
    g.forEach((x,i)=>x.w=eq*share[c]*raw[i]/rt);
  }
  for(let it=0;it<6;it++){
    for(const c of present){
      const g=items.filter(x=>x.c===c);
      let ex=0;g.forEach(x=>{if(x.w>P.cap){ex+=x.w-P.cap;x.w=P.cap}});
      if(ex<=0.0001)continue;
      const open=g.filter(x=>x.w<P.cap-0.0001),tt=open.reduce((a,x)=>a+x.w,0);
      if(!open.length||tt===0)continue;
      open.forEach(x=>x.w+=ex*x.w/tt);
    }
  }
  const sum=items.reduce((a,x)=>a+x.w,0);
  items.sort((a,b)=>b.w-a.w);
  return {items,fixed:100-sum,N:items.length};
}

function portStats(p){
  const it=p.items,eqW=it.reduce((a,x)=>a+x.w,0);
  const stk=it.filter(x=>x.c!=='FI'),sW=stk.reduce((a,x)=>a+x.w,0);
  const wsum=f=>it.reduce((a,x)=>a+x.w*f(x),0);
  const dy=wsum(x=>x.dy)/100;
  const pl=sW?sW/stk.reduce((a,x)=>a+(x.pl>0?x.w/x.pl:0),0):null;
  const roe=sW?stk.reduce((a,x)=>a+x.w*x.roe,0)/sW:null;
  const mgI=stk.filter(x=>x.mg!=null),mgW=mgI.reduce((a,x)=>a+x.w,0),mg=mgW?mgI.reduce((a,x)=>a+x.w*x.mg,0)/mgW:null;
  const beta=wsum(x=>x.b)/100,betaEq=wsum(x=>x.b)/eqW;
  const mos=wsum(x=>x.mos)/eqW,score=wsum(x=>x.score)/eqW;
  const er=wsum(x=>x.er)/100+p.fixed/100*state.rf;
  const f={};for(const k of FK)f[k]=wsum(x=>x.f[k])/eqW;
  const sectors={};it.forEach(x=>sectors[x.s]=(sectors[x.s]||0)+x.w);
  const effN=eqW*eqW/it.reduce((a,x)=>a+x.w*x.w,0);
  const us=it.filter(x=>x.c==='US').reduce((a,x)=>a+x.w,0);
  const fi=it.filter(x=>x.c==='FI').reduce((a,x)=>a+x.w,0);
  const crash=-(eqW/100)*betaEq*30;
  return {dy,pl,roe,mg,beta,mos,score,er,f,sectors,effN,us,fi,br:eqW-us-fi,eqW,crash};
}

function reasons(s){
  const good=[],att=[],r=(k,p)=>t(k,p);
  if(s.c==='FI'){
    if(s.mos>=5)good.push(r('r.fnav',{p:fmt(s.mos,0)}));
    if(s.dy>=9)good.push(r('r.fdy',{p:fmt(s.dy,1)}));
    if(s.vac!=null&&s.vac<=5)good.push(r('r.fvac',{p:fmt(s.vac,0)}));
    if(s.mos<=-5)att.push(r('r.fprem',{p:fmt(-s.mos,0)}));
    if(s.vac!=null&&s.vac>=8)att.push(r('r.fvac+',{p:fmt(s.vac,0)}));
    if(s.s==='f_pap')att.push(r('r.fpaper'));
    att.push(r('r.frate'));
    return {good:good.slice(0,4),att:att.slice(0,4)};
  }
  if(s.mos>=20)good.push(r('r.mos',{p:fmt(Math.min(s.mos,100),0)}));
  if(s.roe>=20)good.push(r('r.roe',{p:fmt(s.roe,0)}));
  if(s.mg!=null&&s.mg>=20)good.push(r('r.mg',{p:fmt(s.mg,0)}));
  if(s.dy>=6)good.push(r('r.dy',{p:fmt(s.dy,1)}));
  if(s.g>=12)good.push(r('r.g',{p:fmt(s.g,0)}));
  if(s.b<=.7)good.push(r('r.beta'));
  if(s.dv!=null&&s.dv<=.5)good.push(r('r.debt0'));
  if(s.mos<=-20)att.push(r('r.prem',{p:fmt(Math.abs(Math.max(s.mos,-60)),0)}));
  if(s.dv!=null&&s.dv>3)att.push(r('r.debt',{x:fmt(s.dv,1)}));
  if(s.b>=1.2)att.push(r('r.beta+'));
  if(s.dy<1)att.push(r('r.nodiv'));
  if(s.g<3)att.push(r('r.lowg'));
  if(s.c==='US')att.push(r('r.fxrisk'));
  return {good:good.slice(0,4),att:att.slice(0,4)};
}

function squarify(items,W,H){
  const total=items.reduce((a,i)=>a+i.v,0),out=[];
  let rest=items.map(i=>({...i,area:i.v/total*W*H})),x=0,y=0,w=W,h=H;
  const worst=(row,side)=>{const s=row.reduce((a,r)=>a+r.area,0),mx=Math.max(...row.map(r=>r.area)),mn=Math.min(...row.map(r=>r.area));return Math.max(side*side*mx/(s*s),s*s/(side*side*mn))};
  while(rest.length){
    const side=Math.min(w,h);let row=[rest[0]],i=1;
    while(i<rest.length){const nr=row.concat(rest[i]);if(worst(nr,side)<=worst(row,side)){row=nr;i++}else break}
    const s=row.reduce((a,r)=>a+r.area,0);
    if(w>=h){const cw=s/h;let cy=y;row.forEach(r=>{const ch=r.area/cw;out.push({...r,x,y:cy,w:cw,h:ch});cy+=ch});x+=cw;w-=cw}
    else{const rh=s/w;let cx=x;row.forEach(r=>{const cw=r.area/rh;out.push({...r,x:cx,y,w:cw,h:rh});cx+=cw});y+=rh;h-=rh}
    rest=rest.slice(row.length);
  }
  return out;
}

function qty(x,valBrl){
  const pr=x.price;
  if(!pr||pr<=0)return null;
  const local=x.c==='US'?valBrl/MACRO.usd:valBrl;
  return Math.floor(local/pr);
}

function niceStep(max,n){const raw=max/n,p=Math.pow(10,Math.floor(Math.log10(raw))),f=raw/p;return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p}

function scatter(){
  const W=360,H=300,m={l:38,r:14,t:12,b:40},iw=W-m.l-m.r,ih=H-m.t-m.b;
  const xs=SC.map(x=>x.b),ys=SC.map(x=>x.score);
  const x0=.1,x1=Math.ceil(Math.max(...xs)*5)/5+.1;
  const y0=Math.floor(Math.min(...ys)/10)*10,y1=Math.ceil(Math.max(...ys)/10)*10;
  const X=v=>m.l+(v-x0)/(x1-x0)*iw,Y=v=>m.t+(1-(v-y0)/(y1-y0))*ih;
  let s='';
  for(let v=y0;v<=y1;v+=10)s+=`<line class="grid" x1="${m.l}" x2="${W-m.r}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${m.l-6}" y="${Y(v)+3}" text-anchor="end" font-size="9">${v}</text>`;
  for(let v=Math.ceil(x0*5)/5;v<=x1+.001;v+=.2)s+=`<text x="${X(v)}" y="${H-m.b+14}" text-anchor="middle" font-size="9">${fmt(v,1)}</text>`;
  const mxm=X(1),myv=Y((y0+y1)/2);
  s+=`<rect x="${m.l}" y="${m.t}" width="${mxm-m.l}" height="${myv-m.t}" fill="var(--accent)" opacity=".08"/><text x="${m.l+6}" y="${m.t+12}" font-size="9" style="fill:var(--accent)">${t('map.good')}</text>`;
  s+=`<line class="axis" x1="${m.l}" x2="${W-m.r}" y1="${H-m.b}" y2="${H-m.b}"/><line class="axis" x1="${m.l}" x2="${m.l}" y1="${m.t}" y2="${H-m.b}"/>`;
  s+=`<text x="${m.l+iw/2}" y="${H-6}" text-anchor="middle" font-size="10">${t('map.x')}</text><text transform="translate(11 ${m.t+ih/2}) rotate(-90)" text-anchor="middle" font-size="10">${t('map.y')}</text>`;
  const inP=new Set(PORT.items.map(x=>x.t)),placed=[];
  const place=(px,py,tx)=>{const wd=tx.length*5.6+2,hd=10;
    for(const c of [[8,-5,'start'],[8,11,'start'],[-8,-5,'end'],[-8,11,'end'],[0,-10,'middle'],[0,19,'middle']]){
      const x=px+c[0],y=py+c[1],a=c[2],xa=a==='start'?x:a==='end'?x-wd:x-wd/2;
      const r={x0:xa,x1:xa+wd,y0:y-hd+1,y1:y+2};
      if(r.x0<m.l+2||r.x1>W-2||r.y0<m.t)continue;
      if(placed.some(o=>!(r.x1<o.x0||r.x0>o.x1||r.y1<o.y0||r.y0>o.y1)))continue;
      placed.push(r);return {x,y,a}}
    return null};
  const out=SC.filter(x=>!inP.has(x.t)),inn=SC.filter(x=>inP.has(x.t)).sort((a,b)=>b.score-a.score);
  out.forEach(d=>{s+=`<g class="pt" data-open="${d.t}"><circle cx="${X(d.b)}" cy="${Y(d.score)}" r="12" fill="transparent"/><circle cx="${X(d.b)}" cy="${Y(d.score)}" r="3.4" fill="none" stroke="var(--ink-2)" stroke-width="1.3"/></g>`;placed.push({x0:X(d.b)-4,x1:X(d.b)+4,y0:Y(d.score)-4,y1:Y(d.score)+4})});
  inn.forEach(d=>{const col=d.c==='BR'?'var(--fill-br)':d.c==='US'?'var(--fill-us)':'var(--fill-re)',px=X(d.b),py=Y(d.score);placed.push({x0:px-5,x1:px+5,y0:py-5,y1:py+5});
    s+=`<g class="pt" data-open="${d.t}"><circle cx="${px}" cy="${py}" r="12" fill="transparent"/><circle cx="${px}" cy="${py}" r="5" fill="${col}"/></g>`});
  inn.forEach(d=>{const l=place(X(d.b),Y(d.score),d.t);if(l)s+=`<text class="tl" x="${l.x}" y="${l.y}" text-anchor="${l.a}" font-size="9" font-weight="600">${d.t}</text>`});
  $('#scatter').innerHTML=s;
}

function fv(amt,pmt,r,yrs){
  const g=Math.pow(1+Math.max(r,-50)/100,yrs),rm=Math.pow(1+Math.max(r,-50)/100,1/12)-1;
  return amt*g+(rm>1e-9?pmt*(Math.pow(1+rm,12*yrs)-1)/rm:pmt*12*yrs);
}
function sim(st){
  const years=HZ[state.hz].years,amt=state.amount||0,pmt=state.pmt||0;
  $('#sim-sub').textContent=t('sim.years',{n:years});
  const sc=[['sim.bad',st.er-5,'var(--bad)'],['sim.base',st.er,'var(--accent)'],['sim.good',st.er+4,'var(--good)'],['sim.only',state.rf,'var(--ink-2)']];
  $('#sim-leg').innerHTML=sc.map(([n,r,c])=>`<span><i style="background:${c}"></i>${t(n)}</span>`).join('');
  const W=360,H=240,m={l:52,r:14,t:12,b:30},iw=W-m.l-m.r,ih=H-m.t-m.b;
  const maxV=Math.max(...sc.map(x=>fv(amt,pmt,x[1],years)),amt*1.05,1),step=niceStep(maxV,4),top=Math.ceil(maxV/step)*step;
  const X=tt=>m.l+tt/years*iw,Y=v=>m.t+(1-v/top)*ih;
  let s='';
  for(let v=0;v<=top+.001;v+=step)s+=`<line class="grid" x1="${m.l}" x2="${W-m.r}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${m.l-6}" y="${Y(v)+3}" text-anchor="end" font-size="9">${v===0?'0':brlc(v)}</text>`;
  const xs=years<=5?1:2;
  for(let tt=0;tt<=years;tt+=xs)s+=`<text x="${X(tt)}" y="${H-m.b+14}" text-anchor="middle" font-size="9">${tt===0?t('sim.today'):tt+t('sim.y')}</text>`;
  s+=`<line class="axis" x1="${m.l}" x2="${W-m.r}" y1="${H-m.b}" y2="${H-m.b}"/>`;
  sc.forEach(([n,r,c],i)=>{
    let d='';for(let tt=0;tt<=years;tt+=.25)d+=(tt===0?'M':'L')+X(tt).toFixed(1)+' '+Y(fv(amt,pmt,r,tt)).toFixed(1);
    s+=`<path d="${d}" fill="none" stroke="${c}" stroke-width="${i===1?2.6:1.8}" ${i===3?'stroke-dasharray="4 3"':''} stroke-linecap="round"/><circle cx="${X(years)}" cy="${Y(fv(amt,pmt,r,years))}" r="3.4" fill="${c}"/>`;
  });
  $('#sim').innerHTML=s;
  const defl=Math.pow(1+MACRO.ipca/100,years);
  $('#sim-tbl').innerHTML=`<tr><th>${t('sim.th1')}</th><th>${t('sim.th2')}</th><th>${t('sim.th3',{n:years})}</th><th>${t('sim.th4')}</th></tr>`+sc.map(([n,r])=>{const v=fv(amt,pmt,r,years);return `<tr><td>${t(n)}</td><td class="mono">${fmt(r,1)}%</td><td class="mono"><b>${brl(v)}</b></td><td class="mono">${brl(v/defl)}</td></tr>`}).join('');
}
